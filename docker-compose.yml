services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      # Defaults are a healthy gateway; override at runtime via PUT /config.
      GATEWAY_SLOW_MS: "0"
      GATEWAY_DROP_RECEIPT: "0"
      GATEWAY_REJECT: "0"
      GATEWAY_STATE_PATH: /srv/data/gateway.json
    volumes:
      - gateway-data:/srv/data
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_PATH: /srv/data/alarms.db
      GATEWAY_URL: http://gateway:9000
      # Keep the POST timeout below the gateway's slow-response injection so
      # the "receipt lost" path is reachable during manual testing.
      GATEWAY_TIMEOUT_SECONDS: "2.0"
      GATEWAY_LOOKUP_TIMEOUT_SECONDS: "1.0"
      WORKER_INTERVAL_SECONDS: "0.1"
      DELIVERY_LEASE_SECONDS: "10"
      RECONCILE_ON_READ: "true"
      LOG_LEVEL: info
      # Overheating detection: contacts and confirmation deadline applied when
      # a confirmed thermal event creates its single alarm. The manual
      # POST /alarms endpoint still accepts per-request contacts and deadline.
      THERMAL_SAMPLE_WINDOW_SECONDS: "120"
      THERMAL_HIGH_THRESHOLD_C: "70"
      THERMAL_RESET_THRESHOLD_C: "65"
      THERMAL_CONSECUTIVE_REQUIRED: "3"
      THERMAL_MAX_GAP_SECONDS: "60"
      THERMAL_ACK_DEADLINE_SECONDS: "10"
      THERMAL_PRIMARY_CONTACT_NAME: "主值班员 张工"
      THERMAL_PRIMARY_CONTACT_CHANNEL: "app"
      THERMAL_BACKUP_CONTACT_NAME: "备班 李工"
      THERMAL_BACKUP_CONTACT_CHANNEL: "sms"
      THERMAL_BACKUP_CONTACT_ADDRESS: "+8613800000000"
    volumes:
      - api-data:/srv/data
    ports:
      - "8000:8000"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  api-data:
  gateway-data:
